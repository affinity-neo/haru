<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9">
  <title>하루 | 일정과 업무</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard" aria-label="하루 대시보드"><span class="brand-mark">ㅎ</span><span>하루</span></a>
      <div class="sidebar-date" id="sidebarDate"></div>
      <nav class="main-nav" aria-label="주 메뉴">
        <a href="#dashboard" data-view="dashboard"><span class="nav-icon">◫</span>대시보드</a>
        <a href="#all" data-view="all"><span class="nav-icon">▤</span>전체 업무 <span class="nav-count" id="allCount">0</span></a>
        <a href="#today" data-view="today"><span class="nav-icon">☼</span>오늘 할 일 <span class="nav-count" id="todayCount">0</span></a>
        <a href="#someday" data-view="someday"><span class="nav-icon">⌁</span>언젠가</a>
        <a href="#calendar" data-view="calendar"><span class="nav-icon">▦</span>캘린더</a>
      </nav>
      <section class="sidebar-categories"><div class="sidebar-section-title"><span>카테고리</span><button id="addCategoryTask" aria-label="이 카테고리에 업무 추가">＋</button></div><nav id="categoryNav" aria-label="업무 카테고리"></nav></section>
      <div class="sidebar-bottom">
        <div class="sync-card"><span class="sync-dot" id="syncDot"></span><div><strong id="syncLabel">이 기기에 저장 중</strong><small id="syncSub">데이터는 브라우저에 보관됩니다</small></div></div>
        <button class="settings-link" id="settingsOpen"><span>⚙</span> 동기화 설정</button>
        <p class="free-note">무료로 운영 · AI API 없음</p>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar"><button id="mobileMenu" class="icon-button mobile-menu" aria-label="메뉴">☰</button><div class="crumb" id="breadcrumb">캘린더</div><div class="top-actions"><button class="button button-light undo-button" id="undoButton" title="되돌리기 · Ctrl+Z" disabled>↶ <span>되돌리기</span></button><button class="button button-primary" id="quickAdd"><span>＋</span> 업무 추가</button><button class="avatar" id="accountButton" title="계정 및 동기화">나</button></div></header>
      <div class="content" id="content"></div>
    </main>
  </div>
  <div class="drawer-backdrop" id="taskDrawerBackdrop" hidden><aside class="task-drawer" role="dialog" aria-modal="true" aria-labelledby="taskDrawerHeading"><header class="drawer-header"><div><span class="drawer-kicker">업무</span><h2 id="taskDrawerHeading">업무 상세</h2></div><button class="icon-button" id="taskDrawerClose" aria-label="닫기">×</button></header><div id="taskDrawerBody"></div></aside></div>
  <nav class="mobile-nav" aria-label="모바일 메뉴">
    <a href="#dashboard" data-view="dashboard"><span>◫</span>홈</a><a href="#all" data-view="all"><span>▤</span>업무</a><a href="#today" data-view="today"><span>☼</span>오늘</a><a href="#calendar" data-view="calendar"><span>▦</span>캘린더</a><a href="#someday" data-view="someday"><span>⌁</span>언젠가</a>
  </nav>
  <div class="modal-backdrop" id="modalBackdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="modal-header"><div><span class="eyebrow" id="modalEyebrow">빠른 입력</span><h2 id="modalTitle">새 업무</h2></div><button class="icon-button" id="modalClose" aria-label="닫기">×</button></header><div id="modalBody"></div></section></div>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
